name: Aggregate Shaikh

on:
  schedule:
    - cron: "30 * * * *"  # allow boost repos time to finish first
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shaikh
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: GeoLite cache key
        id: geo-date
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache GeoLite2 Country
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/GeoLite2-Country.mmdb
          key: geolite2-country-${{ runner.os }}-${{ steps.geo-date.outputs.week }}

      - name: Install dependencies
        run: pip install aiohttp aiohttp-socks geoip2

      - name: Fetch shared v2 proxy engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_country.py -o geo_country.py
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_runner.py -o geo_runner.py

      - name: Aggregate 10 boosts and reclassify country with MaxMind
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python geo_runner.py aggregate.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f geo_country.py geo_runner.py
          for i in {1..3}; do
            git add -A
            git diff --cached --quiet || git commit -m "Aggregate 10 boosts with proxy pool v2 [skip ci]"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase --autostash origin "$BRANCH" && git push origin HEAD && break
            echo "Push failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
